# 一键部署到 Render（免费，无需信用卡）
# 用法：把整个 scheduler-app 文件夹推到 GitHub，
# 在 https://render.com 新建 "Blueprint" 并关联该仓库即可。
# 部署时会自动创建一个免费 Postgres 数据库并注入 DATABASE_URL，
# 所有房间/日程数据存在数据库里，与 Render 服务本身的临时磁盘无关，永久不丢。
databases:
  - name: scheduler-db
    databaseName: scheduler
    user: scheduler_user
    plan: free
    postgresMajorVersion: 16

services:
  - type: web
    name: meet-scheduler
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /
    envVars:
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: scheduler-db
          property: connectionString
